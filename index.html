<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ボードノート">
<meta name="theme-color" content="#f3f5f8"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>html,body{margin:0}</style></head><body>
<title>ボードノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 全面キャンバス + 左の縦ツールレール + 上の浮きバー。UIは付箋の黄色を目印にする */
:root{
  --board:#f3f5f8; --dot:#a9b3c2; --panel:#ffffff; --line:#dbe0e8;
  --fg:#1d2129; --muted:#5f6b7d; --accent:#ffd23a; --accent-ink:#1d2129;
  --sel:#2864dc; --shadow:0 6px 24px rgba(22,32,54,.12),0 1px 3px rgba(22,32,54,.08);
  --ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --hand:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Zen Maru Gothic","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --board:#16181d; --dot:#454c59; --panel:#22252c; --line:#353a45;
  --fg:#e8eaee; --muted:#9aa3b2; --accent:#ffd23a; --accent-ink:#16181d;
  --sel:#7aa5ff; --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#16181d; --dot:#454c59; --panel:#22252c; --line:#353a45;
  --fg:#e8eaee; --muted:#9aa3b2; --accent:#ffd23a; --accent-ink:#16181d;
  --sel:#7aa5ff; --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--board);color:var(--fg);font-family:var(--ui);margin:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0;touch-action:none}
#overlay{pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.ib:active{background:var(--line)}
.ib[disabled]{opacity:.35;cursor:default}

/* top bars */
.bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:2px;padding:3px;z-index:20}
#barL{left:calc(10px + env(safe-area-inset-left,0px));max-width:calc(100% - 290px)}
#barR{right:calc(10px + env(safe-area-inset-right,0px))}
#boardBtn{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 12px;border-radius:10px;min-width:0}
#boardName{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#status{font-size:12px;color:var(--muted);padding:0 10px 0 2px;white-space:nowrap}
#status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2f9e5b;margin-right:6px;vertical-align:1px}
#status[data-s="dirty"]::before{background:var(--accent)}
#status[data-s="error"]::before{background:#e03e45}
.sep{width:1px;height:24px;background:var(--line);margin:0 3px}
#zoomBtn{height:44px;min-width:58px;padding:0 8px;border-radius:10px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
#fingerBtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* tool rail */
#rail{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:2px;padding:4px;z-index:20;max-height:calc(100% - 140px);overflow-y:auto}
#rail .ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#rail .sep{width:28px;height:1px;margin:3px auto}

/* flyout */
#flyout{position:fixed;z-index:21;padding:8px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:block}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
.sw.sq{border-radius:7px}
.sz{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.sz span{display:block;border-radius:50%;background:var(--fg)}
.sz[aria-pressed="true"],.shp[aria-pressed="true"]{background:var(--line)}
.shp{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}

/* selection tools */
#seltools{position:fixed;z-index:22;display:flex;align-items:center;gap:2px;padding:3px}
#seltools .sw{width:26px;height:26px;margin:0 2px}

/* editor */
#editor{position:absolute;z-index:5;margin:0;border:0;outline:none;resize:none;overflow:hidden;background:transparent;
  font-family:var(--hand);font-weight:600;-webkit-user-select:text;user-select:text;padding:0;line-height:1.35;white-space:pre-wrap;word-break:break-all}
#editor.note{color:#22252b;text-align:center}
#editor.text{caret-color:var(--sel)}

/* boards drawer */
#boards{position:fixed;z-index:30;top:calc(62px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));
  width:min(340px,calc(100% - 20px));max-height:calc(100% - 90px);display:flex;flex-direction:column;overflow:hidden}
#boards h2{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:0;padding:14px 16px 6px}
#blist{overflow-y:auto;padding:0 6px 6px;display:flex;flex-direction:column;gap:2px}
.brow{display:flex;align-items:center;gap:2px;border-radius:10px}
.brow.cur{background:var(--line)}
.brow .open{flex:1;min-width:0;text-align:left;padding:10px 10px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .open small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.brow input{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--board);color:var(--fg);-webkit-user-select:text;user-select:text}
.brow .ask{flex:1;padding:10px;font-size:14px}
.tbtn{height:36px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:700}
.tbtn.danger{background:#e03e45;color:#fff}
.tbtn.plain{background:var(--line)}
.dfoot{border-top:1px solid var(--line);padding:6px;display:flex;flex-wrap:wrap;gap:4px}
.dfoot button{flex:1 1 auto;height:42px;border-radius:10px;font-size:14px;font-weight:700;padding:0 10px}
.dfoot button:active{background:var(--line)}

#toast{position:fixed;z-index:40;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  padding:10px 16px;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:560px){#status{display:none}#barL{max-width:calc(100% - 250px)}#boardName{max-width:26vw}}
@media (prefers-reduced-motion:no-preference){#flyout,#seltools,#boards{animation:pop .12s ease-out}}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
</style>

<div id="stage">
  <canvas id="board"></canvas>
  <canvas id="overlay"></canvas>
  <textarea id="editor" hidden spellcheck="false" autocapitalize="off"></textarea>
</div>

<div id="barL" class="bar panel">
  <button id="boardBtn" aria-haspopup="true" aria-expanded="false"><span id="boardName">ボード</span>
    <svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M6 9l6 6 6-6"/></svg></button>
  <span id="status" data-s="saved">保存済み</span>
</div>

<div id="barR" class="bar panel">
  <button class="ib" id="undoBtn" aria-label="取り消し" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
  <button class="ib" id="redoBtn" aria-label="やり直し" disabled><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
  <span class="sep"></span>
  <button class="ib" id="fingerBtn" aria-pressed="false" aria-label="指でも描く"><svg class="i" viewBox="0 0 24 24"><path d="M10 13V4.5a1.5 1.5 0 013 0V11l4 .8a2 2 0 011.6 2.2l-.6 4A3 3 0 0115 20.5h-3.5a3 3 0 01-2.4-1.2L6 15a1.5 1.5 0 012.3-1.9z"/></svg></button>
  <button id="zoomBtn" aria-label="全体を表示">100%</button>
</div>

<nav id="rail" class="panel" aria-label="道具"></nav>
<div id="flyout" class="panel" hidden></div>
<div id="seltools" class="panel" hidden></div>

<aside id="boards" class="panel" hidden>
  <h2>ボード</h2>
  <div id="blist"></div>
  <div class="dfoot">
    <button id="newBoard">＋ 新しいボード</button>
    <button id="exportPng">画像で書き出す</button>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
  </div>
</aside>
<div id="toast" class="panel" hidden></div>
<input type="file" id="imgFile" accept="image/*" hidden>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
"use strict";
/* ============ 基本 ============ */
const $=s=>document.querySelector(s);
const cv=$('#board'),ctx=cv.getContext('2d');
const ov=$('#overlay'),octx=ov.getContext('2d');
const mcv=document.createElement('canvas').getContext('2d');
const stage=$('#stage'),editor=$('#editor');
let W=0,H=0,dpr=1,dark=false;
const view={tx:0,ty:0,z:1};
const now=()=>performance.now();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*100)/100;

const INK={ink:['#1d2129','#e8eaee','黒'],red:['#e03e45','#ff7276','赤'],blue:['#2864dc','#7aa5ff','青'],green:['#23935a','#52cf86','緑'],orange:['#e8820f','#ffad52','橙'],purple:['#7c4ee4','#ad91ff','紫']};
const HL={yellow:['#ffd93b','黄'],green:['#6ee07e','緑'],pink:['#ff85bd','桃'],blue:['#6cbcff','水色']};
const NOTE={yellow:['#fff09a','黄'],pink:['#ffcfe2','桃'],blue:['#c9e5ff','水色'],green:['#cff3c4','緑'],orange:['#ffd8a8','橙'],purple:['#e3d7ff','藤']};
const SIZES={pen:[1.5,3,6],hl:[14,24,40],shape:[2,4,8],text:[22,34,56]};
const ink=k=>(INK[k]||INK.ink)[dark?1:0];
const HAND='"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Zen Maru Gothic","Noto Sans JP",sans-serif';

const prefs={tool:'pen',shape:'r',col:{pen:'ink',hl:'yellow',shape:'ink',note:'yellow',text:'ink'},size:{pen:1,hl:1,shape:1,text:1},finger:false};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('bn.prefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('bn.prefs',JSON.stringify(prefs))}catch(e){}};

/* ============ 保存（IndexedDB） ============ */
const store=(()=>{
  let dbp=null;
  function open(){ if(dbp) return dbp;
    dbp=new Promise((res,rej)=>{ let r; try{ r=indexedDB.open('boardnote',1);}catch(e){rej(e);return;}
      r.onupgradeneeded=()=>{const d=r.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');};
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});
    return dbp;}
  async function get(k){ const d=await open(); return new Promise((res,rej)=>{const t=d.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error);});}
  async function set(k,v){ const d=await open(); return new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);});}
  async function del(k){ const d=await open(); return new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);});}
  return {get,set,del};
})();
const mem=new Map(); // IndexedDBが使えないときの退避
async function sget(k){ try{return await store.get(k)}catch(e){return mem.get(k)} }
async function sset(k,v){ try{await store.set(k,v); return true}catch(e){mem.set(k,v); return false} }
async function sdel(k){ try{await store.del(k)}catch(e){mem.delete(k)} }

let boards=[], boardId=null, persistedOK=true;
let items=[], byId=new Map(), maxZ=0;
const undoS=[],redoS=[];
let dirty=false, saveTimer=null, saveChain=Promise.resolve();
const sel=new Set();
let editing=null;

function setStatus(s,txt){ const el=$('#status'); el.dataset.s=s; el.textContent=txt||({saved:'保存済み',dirty:'編集中',error:'保存できません'})[s]; }
function markDirty(){ dirty=true; setStatus('dirty'); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); }
function flush(){ clearTimeout(saveTimer); saveChain=saveChain.then(doFlush).catch(()=>{}); return saveChain; }
async function doFlush(){
  if(!dirty||!boardId) return; dirty=false;
  const ok=await sset('b:'+boardId,{items:items.map(cl)});
  const b=boards.find(b=>b.id===boardId); if(b){b.u=Date.now(); await sset('index',{boards,cur:boardId});}
  persistedOK=ok; setStatus(ok?'saved':'error', ok?null:'保存できません（ブラウザの設定を確認）');
}
let viewTimer=null;
function saveView(){ clearTimeout(viewTimer); viewTimer=setTimeout(()=>{try{localStorage.setItem('bn.v.'+boardId,JSON.stringify(view))}catch(e){}},400); }

/* ============ 項目 ============ */
function cl(it){ const o={}; for(const k in it){ if(k[0]==='_') continue; const v=it[k]; o[k]=Array.isArray(v)?v.slice():v; } return o; }
function inval(it){ delete it._bb; delete it._p; delete it._lay; }
function insertItem(o){ byId.set(o.id,o); let i=items.length; while(i>0&&items[i-1].z>o.z) i--; items.splice(i,0,o); if(o.z>maxZ) maxZ=o.z; }
function removeItem(id){ const it=byId.get(id); if(!it) return; byId.delete(id); items.splice(items.indexOf(it),1); sel.delete(id); }
function setState(id,st){ if(byId.has(id)) removeItem(id); if(st) insertItem(cl(st)); }
function addNew(o){ o.id=uid(); o.z=++maxZ; insertItem(o); markDirty(); return o; }
function commit(ch){ if(!ch.length) return; undoS.push(ch); if(undoS.length>300) undoS.shift(); redoS.length=0; markDirty(); updUndo(); }
function undo(){ endEdit(); const ch=undoS.pop(); if(!ch) return; for(let i=ch.length-1;i>=0;i--) setState(ch[i].id,ch[i].b); redoS.push(ch); sel.clear(); markDirty(); updUndo(); render(); toast('取り消しました',900); }
function redo(){ endEdit(); const ch=redoS.pop(); if(!ch) return; for(const c of ch) setState(c.id,c.a); undoS.push(ch); sel.clear(); markDirty(); updUndo(); render(); toast('やり直しました',900); }
function updUndo(){ $('#undoBtn').disabled=!undoS.length; $('#redoBtn').disabled=!redoS.length; }

/* 形状 */
const rad=(it,p)=>it.w*0.5*(0.35+0.85*p);
function bb(it){
  if(it._bb) return it._bb; let b;
  if(it.t==='s'){ const p=it.pts; let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;
    for(let i=0;i<p.length;i+=3){ if(p[i]<x0)x0=p[i]; if(p[i]>x1)x1=p[i]; if(p[i+1]<y0)y0=p[i+1]; if(p[i+1]>y1)y1=p[i+1]; }
    const m=it.w*0.7; b=[x0-m,y0-m,x1+m,y1+m]; }
  else if(it.t==='a'){ const m=it.sw*4; b=[Math.min(it.x1,it.x2)-m,Math.min(it.y1,it.y2)-m,Math.max(it.x1,it.x2)+m,Math.max(it.y1,it.y2)+m]; }
  else if(it.t==='x'){ const L=textLay(it); b=[it.x,it.y,it.x+it.w,it.y+L.h]; }
  else { const m=(it.t==='r'||it.t==='e')?it.sw/2:0; b=[it.x-m,it.y-m,it.x+it.w+m,it.y+it.h+m]; }
  return it._bb=b;
}
function seg(P,x0,y0,r0,x1,y1,r1){ const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy); if(L<1e-6) return;
  const nx=-dy/L,ny=dx/L; P.moveTo(x0-nx*r0,y0-ny*r0); P.lineTo(x1-nx*r1,y1-ny*r1); P.lineTo(x1+nx*r1,y1+ny*r1); P.lineTo(x0+nx*r0,y0+ny*r0); P.closePath(); }
function dot(P,x,y,r){ P.moveTo(x+r,y); P.arc(x,y,r,0,Math.PI*2); }
function sPath(it){
  if(it._p) return it._p; const p=it.pts,P=new Path2D();
  if(it.hl){ P.moveTo(p[0],p[1]); for(let i=3;i<p.length;i+=3) P.lineTo(p[i],p[i+1]); if(p.length===3) P.lineTo(p[0]+0.01,p[1]); }
  else { for(let i=0;i<p.length;i+=3){ const r=rad(it,p[i+2]); dot(P,p[i],p[i+1],r); if(i) seg(P,p[i-3],p[i-2],rad(it,p[i-1]),p[i],p[i+1],r); } }
  return it._p=P;
}

/* 文字の折り返し */
const cw=new Map();
const NOHEAD='、。，．）」』】〕・ーぁぃぅぇぉっゃゅょァィゥェォッャュョ!?！？ ,.)';
function measure(font,ch){ const k=font+ch; let v=cw.get(k); if(v===undefined){ mcv.font=font; v=mcv.measureText(ch).width; cw.set(k,v);} return v; }
function wrap(text,maxW,fs){
  const font=`600 ${fs}px ${HAND}`, lines=[];
  for(const para of String(text).split('\n')){
    let line='',lw=0;
    for(const ch of para){ const w=measure(font,ch);
      if(lw+w>maxW&&line&&NOHEAD.includes(ch)){ line+=ch; lw+=w; continue; }
      if(lw+w>maxW&&line){ const sp=line.lastIndexOf(' ');
        if(sp>0&&/[ -~]/.test(ch)&&ch!==' '){ lines.push(line.slice(0,sp)); line=line.slice(sp+1)+ch; lw=0; for(const c of line) lw+=measure(font,c); }
        else { lines.push(line); line=ch===' '?'':ch; lw=ch===' '?0:w; } }
      else { line+=ch; lw+=w; } }
    lines.push(line); }
  return lines;
}
function noteLay(it){
  const key=it.text+'|'+it.w+'|'+it.h+'|'+it.fs; if(it._lay&&it._lay.key===key) return it._lay;
  const pad=it.w*0.08, aw=it.w-pad*2, ah=it.h-pad*2; let fs=it.fs, lines;
  for(;;){ lines=it.text?wrap(it.text,aw,fs):[]; if(lines.length*fs*1.35<=ah||fs<=it.fs*0.25) break; fs*=0.88; }
  return it._lay={key,fs,lines,lh:fs*1.35,pad};
}
function textLay(it){
  const key=it.text+'|'+it.w+'|'+it.fs; if(it._lay&&it._lay.key===key) return it._lay;
  const lines=wrap(it.text||'',it.w,it.fs), lh=it.fs*1.3;
  return it._lay={key,lines,lh,h:Math.max(1,lines.length)*lh};
}

/* 当たり判定 */
function dSeg(px,py,x0,y0,x1,y1){ const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy; let t=l2?((px-x0)*dx+(py-y0)*dy)/l2:0; t=clamp(t,0,1); return Math.hypot(px-x0-t*dx,py-y0-t*dy); }
function hit(it,x,y,tol){
  const b=bb(it); if(x<b[0]-tol||x>b[2]+tol||y<b[1]-tol||y>b[3]+tol) return false;
  switch(it.t){
    case 'n': case 'x': case 'i': return true;
    case 's': { const p=it.pts; if(p.length===3) return Math.hypot(x-p[0],y-p[1])<=it.w/2+tol;
      for(let i=3;i<p.length;i+=3){ const r=it.hl?it.w/2:rad(it,p[i+2]); if(dSeg(x,y,p[i-3],p[i-2],p[i],p[i+1])<=r+tol) return true; } return false; }
    case 'r': { const t=it.sw/2+tol, inX=x>=it.x-t&&x<=it.x+it.w+t, inY=y>=it.y-t&&y<=it.y+it.h+t;
      return (inY&&(Math.abs(x-it.x)<=t||Math.abs(x-it.x-it.w)<=t))||(inX&&(Math.abs(y-it.y)<=t||Math.abs(y-it.y-it.h)<=t)); }

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);

$('#restoreBtn').onclick=()=>{ closePanels(); $('#restoreFile').click(); };
$('#restoreFile').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(d.app!=='boardnote'||!Array.isArray(d.boards)) throw 0; let n=0, last=null;
    for(const b of d.boards){ const exists=boards.some(x=>x.id===b.id); const id=exists?uid():b.id;
      boards.push({id,name:b.name+(exists?'（復元）':''),u:b.u||Date.now()}); await sset('b:'+id,{items:b.items||[]}); n++; last=id; }
    await sset('index',{boards,cur:boardId}); if(last) await openBoard(last); toast(n+'枚のボードを復元しました');
  }catch(err){ toast('バックアップファイルとして読めませんでした'); } };

/* トースト */
let toastT=null; function toast(m,ms=2200){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,ms); }

/* キーボード */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target===editor) return;
  const k=e.key.toLowerCase(), mod=e.metaKey||e.ctrlKey;
  if(mod&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&k==='y'){ e.preventDefault(); redo(); return; }
  if((k==='backspace'||k==='delete')&&sel.size){ e.preventDefault(); st.querySelector('[data-sact="del"]')?.click(); return; }
  if(k==='escape'){ sel.clear(); closePanels(); render(); return; }
  if(k===' '){ spaceDown=true; return; }
  if(mod) return;
  const m={v:'select',h:'hand',p:'pen',m:'hl',e:'eraser',s:'shape',n:'note',t:'text'}[k]; if(m) setTool(m);
});
document.addEventListener('keyup',e=>{ if(e.key===' ') spaceDown=false; });

/* 画面・テーマ */
function computeDark(){ const t=document.documentElement.dataset.theme; dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches); readColors(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ computeDark(); buildFly(); selKey=''; render(); });
new MutationObserver(()=>{ computeDark(); buildFly(); selKey=''; render(); }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){ dpr=Math.min(window.devicePixelRatio||1,3); const r=stage.getBoundingClientRect(); SR=r; W=r.width; H=r.height;
  for(const c of [cv,ov]){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); c.style.width=W+'px'; c.style.height=H+'px'; }
  buildFly(); render(); }
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flush(); });
window.addEventListener('pagehide',()=>flush());

/* ============ 初回の使い方ボード ============ */
function welcomeItems(){
  const out=[]; let z=0; const add=o=>{o.id=uid(); o.z=++z; out.push(o); return o;};
  add({t:'x',x:-420,y:-330,w:700,fs:46,col:'ink',text:'使い方（サンプル）'});
  const ul=[]; for(let i=0;i<=40;i++){ const x=-420+i*10.5; ul.push(x,-268+Math.sin(i/6)*1.5,0.6); } add({t:'s',hl:true,col:'yellow',w:22,pts:ul});
  const N=[['yellow','Apple Pencil で書く\nペン・マーカー・消しゴムはペンシルで'],['blue','指1本でスクロール\n2本でつまんでズーム'],['pink','2本指タップで取り消し\n3本指タップでやり直し'],
    ['green','付箋はダブルタップで編集\nペンシルで書けば文字になる（スクリブル）'],['orange','付箋を動かすと\n上に書いた線も一緒に動く'],['purple','左上のボード名から\nボードの追加・バックアップ']];
  N.forEach((n,i)=>{ const col=i%3,row=Math.floor(i/3); add({t:'n',x:-420+col*260,y:-210+row*260,w:230,h:230,bg:n[0],fs:24,text:n[1]}); });
  const c=[]; for(let i=0;i<=64;i++){ const a=-Math.PI*0.6+i/64*Math.PI*2.08; c.push(r2(-305+Math.cos(a)*150),r2(-95+Math.sin(a)*142),r2(0.45+0.4*Math.sin(i/64*Math.PI))); }
  add({t:'s',hl:false,col:'red',w:4,pts:c});
  add({t:'a',x1:370,y1:-120,x2:470,y2:-120,col:'blue',sw:4});
  add({t:'x',x:485,y:-142,w:240,fs:26,col:'blue',text:'自由に消してOK'});
  return out;
}

/* ============ 起動 ============ */
async function boot(){
  computeDark(); resize(); setTool(prefs.tool); $('#fingerBtn').setAttribute('aria-pressed',prefs.finger);
  const idx=await sget('index');
  if(idx&&Array.isArray(idx.boards)&&idx.boards.length){ boards=idx.boards; await openBoard(boards.some(b=>b.id===idx.cur)?idx.cur:boards[0].id); }
  else { boards=[]; const id=await createBoard('使い方',welcomeItems()); await openBoard(id); }
  setStatus('saved');
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&document.querySelector('link[rel="manifest"]')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  if(window.claude&&window.claude.use){ window.claude.use('downloads').then(d=>{downloadsApi=d}).catch(()=>{}); }
}
boot();
